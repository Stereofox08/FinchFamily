<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-base: #faf8fd;
        --surface: #ffffff;
        --surface-soft: #f4f1fb;
        --ink: #241f3d;
        --ink-soft: #8983a8;
        --ink-faint: #c2bdda;
        --line: rgba(36, 31, 61, 0.08);
        --shadow: 0 14px 30px -16px rgba(60, 40, 100, 0.28);
        --shadow-lg: 0 20px 40px -18px rgba(60, 40, 100, 0.32);
        --primary: #7c4dff;
        --primary-light: #f0eaff;
        --primary-ink: #5216ff;
        --expense: #ff4a74;
        --expense-light: #fff0f3;
        --income: #00cc99;
        --income-light: #e6fbf5;
        --saving: #ffaa00;
        --saving-light: #fff7e6;
        --avatar-size: 26px;
        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --font-sora: 'Sora', sans-serif;
        --font-inter: 'Inter', sans-serif;
        --inset-top: 0px;
        --inset-bottom: 0px;
      }
      @supports (padding-top: env(safe-area-inset-top)) {
        :root {
          --inset-top: env(safe-area-inset-top);
          --inset-bottom: env(safe-area-inset-bottom);
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: var(--font-inter);
        background-color: var(--bg-base);
        color: var(--ink);
        padding-top: var(--inset-top);
        padding-bottom: calc(76px + var(--inset-bottom));
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      .safe-top { height: var(--inset-top); background: transparent; width: 100%; }
      header {
        background: var(--surface);
        padding: 16px 20px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      header h1 { font-family: var(--font-sora); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      header p { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
      .view { display: none; padding: 20px 16px; animation: fadeIn 0.25s ease-out forwards; }
      .view.active { display: block; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .card {
        background: var(--surface);
        border-radius: var(--radius-md);
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(36, 31, 61, 0.03);
      }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .wide { grid-column: span 2; }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input, select, textarea {
        background: var(--surface-soft);
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        font-size: 15px;
        font-family: var(--font-inter);
        color: var(--ink);
        font-weight: 500;
        width: 100%;
        outline: none;
        transition: all 0.2s;
        -webkit-appearance: none;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--primary); background: var(--surface); }
      textarea { resize: none; height: 70px; }
      .btn {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius-sm);
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        font-family: var(--font-sora);
        width: 100%;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(124, 77, 255, 0.25);
        transition: transform 0.1s;
      }
      .btn:active { transform: scale(0.98); }
      .btn-text {
        background: none;
        box-shadow: none;
        color: var(--primary);
        font-weight: 600;
        font-size: 14px;
        padding: 6px 0;
        width: auto;
      }
      .btn-text:active { transform: none; opacity: 0.7; }
      .chip-native { display: none !important; }
      .chip-track { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
      .chip {
        background: var(--surface-soft);
        color: var(--ink);
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
        border: 1px solid transparent;
      }
      .chip.selected { background: var(--primary-light); color: var(--primary-ink); border-color: rgba(124, 77, 255, 0.2); }
      .chip-avatar {
        width: var(--avatar-size);
        height: var(--avatar-size);
        border-radius: 50%;
        background: var(--ink-faint);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        font-family: var(--font-sora);
        text-transform: uppercase;
      }
      .chip.selected .chip-avatar { background: var(--primary); color: #fff; }
      .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
      .widget {
        background: var(--surface);
        border-radius: var(--radius-md);
        padding: 16px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 1px solid rgba(36, 31, 61, 0.02);
      }
      .widget-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; }
      .widget-val { font-family: var(--font-sora); font-size: 18px; font-weight: 800; }
      .widget.expense .widget-val { color: var(--expense); }
      .widget.income .widget-val { color: var(--income); }
      .widget.saving .widget-val { color: var(--saving); }
      .widget.total { grid-column: span 2; flex-direction: row; justify-content: space-between; align-items: center; padding: 14px 18px; }
      .widget.total .widget-val { font-size: 20px; }
      .task-item {
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        margin-bottom: 10px;
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1px solid rgba(36, 31, 61, 0.02);
        position: relative;
      }
      .task-check {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 2px solid var(--ink-faint);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .task-check::after {
        content: '';
        width: 10px;
        height: 6px;
        border-left: 2px solid #fff;
        border-bottom: 2px solid #fff;
        transform: rotate(-45deg) translate(1px, -1px);
        opacity: 0;
        transition: all 0.15s;
      }
      .task-item.done .task-check { background: var(--income); border-color: var(--income); }
      .task-item.done .task-check::after { opacity: 1; }
      .task-body { flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .task-title { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.3; word-break: break-word; }
      .task-item.done .task-title { text-decoration: line-through; color: var(--ink-soft); }
      .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .task-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        background: var(--surface-soft);
        color: var(--ink-soft);
      }
      .task-badge.date-overdue { background: var(--expense-light); color: var(--expense); font-weight: 700; }
      .task-badge.date-today { background: var(--saving-light); color: var(--saving); font-weight: 700; }
      .task-item .chip-avatar { width: 20px; height: 20px; font-size: 8px; flex-shrink: 0; }
      .nav-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.85);
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
        border-top: 1px solid var(--line);
        padding: 8px 12px calc(8px + var(--inset-bottom));
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        z-index: 1000;
      }
      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        background: none;
        border: none;
        color: var(--ink-soft);
        cursor: pointer;
        padding: 6px 0;
        border-radius: var(--radius-sm);
        transition: all 0.15s;
      }
      .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s; }
      .nav-item span { font-size: 10px; font-weight: 700; font-family: var(--font-sora); letter-spacing: -0.1px; }
      .nav-item.active { color: var(--primary); background: var(--primary-light); }
      .nav-item.active svg { transform: translateY(-1px); }
      .nav-item.nav-expense.active { color: var(--expense); background: var(--expense-light); }
      .nav-item.nav-income.active { color: var(--income); background: var(--income-light); }
      .nav-item.nav-saving.active { color: var(--saving); background: var(--saving-light); }
      .collapsible {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .collapsible.open { max-height: 1000px; }
      .section-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
      .section-title { font-family: var(--font-sora); font-size: 16px; font-weight: 800; color: var(--ink); }
      #status {
        position: fixed;
        top: calc(12px + var(--inset-top));
        left: 50%;
        transform: translateX(-50%) translateY(-60px);
        background: var(--ink);
        color: #fff;
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        z-index: 9999;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none;
        max-width: 90%;
        text-align: center;
      }
      #status.show { transform: translateX(-50%) translateY(0); }
      #status.error { background: var(--expense); }
      .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <header>
      <h1 id="headerTitle">Наш Дом</h1>
      <p id="headerSubtitle">Синхронизация...</p>
    </header>

    <main class="view" id="todo">
      <div class="section-title-row">
        <h2 class="section-title">Активные дела</h2>
        <button class="btn btn-text" id="toggleTaskFormBtn">+ Новое дело</button>
      </div>

      <div class="collapsible" id="taskFormWrap">
        <form class="card" id="taskForm">
          <div class="grid">
            <label class="wide">
              Что нужно сделать?
              <input type="text" name="task" placeholder="Купить молоко, помыть окно..." required>
            </label>
            <label class="wide">
              Ответственный
              <select id="taskFormResponsible" name="responsible" class="chip-native" data-field="responsible" data-chip="avatar"></select>
              <div class="chip-track" data-for="taskFormResponsible"></div>
            </label>
            <label>
              Дедлайн
              <input type="date" name="deadline">
            </label>
            <label>
              Статус
              <select name="status">
                <option value="В планах" selected>В планах</option>
                <option value="В процессе">В процессе</option>
                <option value="Срочно">Срочно</option>
              </select>
            </label>
            <label class="wide">
              Комментарий
              <textarea name="comment" placeholder="Детали..."></textarea>
            </label>
            <button type="submit" class="btn wide">Добавить дело</button>
          </div>
        </form>
      </div>

      <div class="card" style="padding:10px 14px; margin-bottom:16px; display:flex; align-items:center; gap:10px">
        <span style="font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px">Кто:</span>
        <div class="chip-track" style="margin:0">
          <select id="taskWho" class="chip-native" data-field="responsible" data-with-all="1" data-chip="avatar"></select>
          <div class="chip-track" data-for="taskWho" style="padding:2px 2px 0"></div>
        </div>
      </div>

      <div id="taskList"></div>
    </main>

    <section class="view" id="expense">
      <div class="section-title-row">
        <h2 class="section-title">Записать расход</h2>
      </div>
      <form id="expenseForm">
        <div class="card" style="text-align:center; padding:24px 18px">
          <div style="font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px">Сумма расхода</div>
          <div style="display:inline-flex; align-items:baseline; justify-content:center; gap:4px; width:100%">
            <input type="number" step="any" name="amount" placeholder="0" style="font-family:var(--font-sora); font-size:36px; font-weight:800; text-align:center; background:none; padding:0; border:none; color:var(--expense); width:80%" required autofocus>
            <span style="font-family:var(--font-sora); font-size:24px; font-weight:800; color:var(--expense)">₸</span>
          </div>
        </div>
        <div class="card">
          <label class="wide" style="margin-bottom:10px">
            Кто
            <select id="expenseWho" name="who" class="chip-native" data-field="responsible" data-chip="avatar"></select>
            <div class="chip-track" data-for="expenseWho"></div>
          </label>
          <label class="wide" style="margin-bottom:10px">
            Категория
            <select id="expenseCategory" name="category" class="chip-native" data-field="category_expense" data-chip="plain"></select>
            <div class="chip-track" data-for="expenseCategory"></div>
          </label>
          <label class="wide" style="margin-bottom:10px">
            Способ оплаты
            <select id="expenseMethod" name="method" class="chip-native" data-field="method" data-chip="plain"></select>
            <div class="chip-track" data-for="expenseMethod"></div>
          </label>
          <div class="grid" style="margin-top:14px">
            <label>
              Когда
              <input type="date" name="occurred_on">
            </label>
            <label>
              Инфо
              <input type="text" name="comment" placeholder="Магазин, вещь...">
            </label>
          </div>
          <button type="submit" class="btn wide" style="background:var(--expense); box-shadow:0 4px 12px rgba(255,74,116,0.25); margin-top:16px">Сохранить расход</button>
        </div>
      </form>
    </section>

    <section class="view" id="income">
      <div class="section-title-row">
        <h2 class="section-title">Записать доход</h2>
      </div>
      <form id="incomeForm">
        <div class="card" style="text-align:center; padding:24px 18px">
          <div style="font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px">Сумма дохода</div>
          <div style="display:inline-flex; align-items:baseline; justify-content:center; gap:4px; width:100%">
            <input type="number" step="any" name="amount" placeholder="0" style="font-family:var(--font-sora); font-size:36px; font-weight:800; text-align:center; background:none; padding:0; border:none; color:var(--income); width:80%" required>
            <span style="font-family:var(--font-sora); font-size:24px; font-weight:800; color:var(--income)">₸</span>
          </div>
        </div>
        <div class="card">
          <label class="wide" style="margin-bottom:10px">
            Кто
            <select id="incomeWho" name="who" class="chip-native" data-field="responsible" data-chip="avatar"></select>
            <div class="chip-track" data-for="incomeWho"></div>
          </label>
          <label class="wide" style="margin-bottom:10px">
            Категория
            <select id="incomeCategory" name="category" class="chip-native" data-field="category_income" data-chip="plain"></select>
            <div class="chip-track" data-for="incomeCategory"></div>
          </label>
          <label class="wide" style="margin-bottom:10px">
            Способ
            <select id="incomeMethod" name="method" class="chip-native" data-field="method" data-chip="plain"></select>
            <div class="chip-track" data-for="incomeMethod"></div>
          </label>
          <div class="grid" style="margin-top:14px">
            <label>
              Когда
              <input type="date" name="occurred_on">
            </label>
            <label>
              Инфо
              <input type="text" name="comment" placeholder="Источник...">
            </label>
          </div>
          <button type="submit" class="btn wide" style="background:var(--income); box-shadow:0 4px 12px rgba(0,204,153,0.25); margin-top:16px">Сохранить доход</button>
        </div>
      </form>
    </section>

    <section class="view" id="saving">
      <div class="section-title-row">
        <h2 class="section-title">Состояние бюджета</h2>
      </div>

      <div class="widget-grid">
        <div class="widget total">
          <div style="display:flex; flex-direction:column; gap:2px">
            <span class="widget-label">Остаток на картах</span>
            <span class="widget-val" id="totalBalance">0 ₸</span>
          </div>
          <svg style="width:24px; height:24px; stroke:var(--primary); fill:none; stroke-width:2" viewBox="0 0 24 24"><rect width="22" height="16" x="1" y="4" rx="3"/><path d="M1 10h22M5 14h2"/></svg>
        </div>
        <div class="widget expense">
          <span class="widget-label">Расходы мес.</span>
          <span class="widget-val" id="monthExpense">0 ₸</span>
        </div>
        <div class="widget income">
          <span class="widget-label">Доходы мес.</span>
          <span class="widget-val" id="monthIncome">0 ₸</span>
        </div>
        <div class="widget saving wide" style="flex-direction:row; justify-content:space-between; align-items:center">
          <div style="display:flex; flex-direction:column; gap:2px">
            <span class="widget-label">Всего в копилке</span>
            <span class="widget-val" id="totalSavings" style="color:var(--saving)">0 ₸</span>
          </div>
          <svg style="width:24px; height:24px; stroke:var(--saving); fill:none; stroke-width:2" viewBox="0 0 24 24"><path d="M19 5c0-1.66-4-3-9-3S1 3.34 1 5s4 3 9 3 9-1.34 9-3A2.34 2.34 0 0 0 10 2"/><path d="M19 5v14c0 1.66-4 3-9 3S1 20.66 1 19V5"/><path d="M1 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
        </div>
      </div>

      <div class="section-title-row" style="margin-top:24px">
        <h2 class="section-title">Пополнить копилку</h2>
      </div>
      <form id="savingForm">
        <div class="card" style="text-align:center; padding:24px 18px">
          <div style="font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px">Сумма отложения</div>
          <div style="display:inline-flex; align-items:baseline; justify-content:center; gap:4px; width:100%">
            <input type="number" step="any" name="amount" placeholder="0" style="font-family:var(--font-sora); font-size:36px; font-weight:800; text-align:center; background:none; padding:0; border:none; color:var(--saving); width:80%" required>
            <span style="font-family:var(--font-sora); font-size:24px; font-weight:800; color:var(--saving)">₸</span>
          </div>
        </div>
        <div class="card">
          <label class="wide">
            Кто откладывает
            <select id="savingWho" name="who" class="chip-native" data-field="responsible" data-chip="avatar"></select>
            <div class="chip-track" data-for="savingWho"></div>
          </label>
          <div class="grid" style="margin-top:14px">
            <label>
              Когда
              <input type="date" name="occurred_on">
            </label>
            <label>
              Цель / Коммент
              <input type="text" name="comment" placeholder="На машину, отпуск...">
            </label>
          </div>
          <button type="submit" class="btn wide" style="background:var(--saving); box-shadow:0 4px 12px rgba(255,170,0,0.25); margin-top:16px">Отложить в копилку</button>
        </div>
      </form>
    </section>

    <nav class="nav-bar">
      <button class="nav-item active" onclick="switchView('todo')">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4m-2 8a8 8 0 11-16 0 8 8 0 0116 0z"/></svg>
        <span>Дела</span>
      </button>
      <button class="nav-item nav-expense" onclick="switchView('expense')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 12H8"/></svg>
        <span>Расход</span>
      </button>
      <button class="nav-item nav-income" onclick="switchView('income')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8m-4-4h8"/></svg>
        <span>Доход</span>
      </button>
      <button class="nav-item nav-saving" onclick="switchView('saving')">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Бюджет</span>
      </button>
    </nav>

    <script>
      const APPS_SCRIPT_URL = "https://hgheavnzotfttjapkhik.supabase.co/functions/v1/bright-endpoint";

      let tg = window.Telegram?.WebApp;
      if (tg) {
        tg.expand();
        tg.ready();
        if (tg.headerColor) tg.setHeaderColor('#ffffff');
        if (tg.backgroundColor) tg.setBackgroundColor('#faf8fd');
      }

      let state = {
        today: new Date().toISOString().split('T')[0],
        tasks: [],
        finance: { income: 0, expense: 0, savings: 0 },
        options: { responsible: [], category_expense: [], category_income: [], method: [] },
        filters: { todoWho: 'ALL' },
        debugSpreadsheetName: ''
      };

      window.addEventListener('DOMContentLoaded', () => {
        initDefaults();
        loadData();
        setupFormListeners();
        setupToggleForm();
      });

      function initDefaults() {
        document.querySelectorAll('input[type="date"]').forEach(inp => {
          inp.value = state.today;
        });
      }

      function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-bar .nav-item').forEach(i => i.classList.remove('active'));
        
        const targetView = document.getElementById(viewId);
        if (targetView) targetView.focus();

        document.getElementById(viewId).classList.add('active');
        const btn = document.querySelector(`.nav-bar .nav-${viewId}`) || document.querySelector('.nav-bar .nav-item:first-child');
        if (btn) btn.classList.add('active');

        if (tg && tg.HapticFeedback) {
          tg.HapticFeedback.impactOccurred('light');
        }
      }

      function setupToggleForm() {
        const btn = document.getElementById('toggleTaskFormBtn');
        const wrap = document.getElementById('taskFormWrap');
        if(!btn || !wrap) return;
        btn.addEventListener('click', () => {
          if (wrap.classList.contains('open')) {
            wrap.classList.remove('open');
            btn.textContent = '+ Новое дело';
          } else {
            wrap.classList.add('open');
            btn.textContent = 'Свернуть форму';
            wrap.querySelector('input[name="task"]')?.focus();
          }
        });
      }

      function loadData() {
        setStatus("Загрузка актуального состояния...");
        request('getAppState')
          .then(data => {
            state = { ...state, ...data };
            if (state.today) {
              document.querySelectorAll('input[type="date"]').forEach(inp => {
                if(!inp.value) inp.value = state.today;
              });
            }
            if (state.debugSpreadsheetName) {
              document.getElementById('headerTitle').textContent = "Наш Дом";
              document.getElementById('headerSubtitle').textContent = `База данных: ${state.debugSpreadsheetName}`;
            }
            populateAllSelects();
            renderAll();
            setStatus("");
          })
          .catch(err => {
            showError("Не удалось связаться с Supabase: " + err.message);
          });
      }

      function populateAllSelects() {
        document.querySelectorAll('select[data-field]').forEach(select => {
          const fieldName = select.getAttribute('data-field');
          const withAll = select.getAttribute('data-with-all') === "1";
          const type = select.getAttribute('data-chip') || 'plain';
          const items = state.options[fieldName] || [];
          
          let html = '';
          if (withAll) {
            html += `<option value="ALL" selected>Все члены семьи</option>`;
          }
          items.forEach((val, idx) => {
            const sel = (!withAll && idx === 0) ? 'selected' : '';
            html += `<option value="${val}" ${sel}>${val}</option>`;
          });
          select.innerHTML = html;
          buildChips(select, type);
        });
      }

      function buildChips(nativeSelect, type) {
        const id = nativeSelect.id;
        let track = document.querySelector(`.chip-track[data-for="${id}"]`);
        if (!track) return;
        
        const renderTracks = () => {
          let html = '';
          Array.from(nativeSelect.options).forEach(opt => {
            const isSel = opt.selected;
            if (type === 'avatar') {
              const letter = opt.value === 'ALL' ? '?' : opt.value.charAt(0);
              html += `
                <div class="chip ${isSel?'selected':''}" data-value="${opt.value}">
                  <div class="chip-avatar">${letter}</div>
                  <span>${opt.text}</span>
                </div>`;
            } else {
              html += `
                <div class="chip ${isSel?'selected':''}" data-value="${opt.value}">
                  <span>${opt.text}</span>
                </div>`;
            }
          });
          track.innerHTML = html;

          track.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
              nativeSelect.value = chip.getAttribute('data-value');
              nativeSelect.dispatchEvent(new Event('change'));
            });
          });
        };

        nativeSelect.addEventListener('change', () => {
          renderTracks();
        });

        renderTracks();
      }

      function renderAll() {
        renderTasks();
        renderFinance();
      }

      function renderFinance() {
        const f = state.finance || { income: 0, expense: 0, savings: 0 };
        const inc = Number(f.income || 0);
        const exp = Number(f.expense || 0);
        const sav = Number(f.savings || 0);
        const cardBalance = inc - exp - sav;

        document.getElementById('totalBalance').textContent = formatMoney(cardBalance);
        document.getElementById('monthExpense').textContent = formatMoney(exp);
        document.getElementById('monthIncome').textContent = formatMoney(inc);
        document.getElementById('totalSavings').textContent = formatMoney(sav);
      }

      function renderTasks() {
        const container = document.getElementById('taskList');
        if (!container) return;
        container.innerHTML = '';
        
        let list = state.tasks || [];
        if (state.filters.todoWho !== 'ALL') {
          list = list.filter(t => t.responsible === state.filters.todoWho);
        }

        if (list.length === 0) {
          container.innerHTML = `<div class="empty-state">Нет активных дел для выбранного фильтра. Красота!</div>`;
          return;
        }

        list.forEach(t => {
          const item = document.createElement('div');
          item.className = `task-item ${t.done ? 'done' : ''}`;
          
          let badgesHtml = '';
          if (t.status && t.status !== 'В планах') {
            badgesHtml += `<span class="task-badge" style="background:var(--primary-light); color:var(--primary-ink)">${t.status}</span>`;
          }
          if (t.deadline) {
            const dStr = t.deadline.split('T')[0];
            let bCls = '';
            if (dStr === state.today) bCls = 'date-today';
            else if (dStr < state.today) bCls = 'date-overdue';
            badgesHtml += `<span class="task-badge ${bCls}">${formatDateHuman(dStr)}</span>`;
          }
          if (t.comment) {
            badgesHtml += `<span class="task-badge" style="max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(t.comment)}</span>`;
          }

          const avatarLetter = t.responsible ? t.responsible.charAt(0) : '?';

          item.innerHTML = `
            <div class="task-check" onclick="completeTask(${t.id})"></div>
            <div class="task-body">
              <div class="task-title">${escapeHtml(t.task)}</div>
              <div class="task-meta">
                <div class="chip-avatar">${avatarLetter}</div>
                ${badgesHtml}
              </div>
            </div>
          `;
          container.appendChild(item);
        });
      }

      function completeTask(id) {
        if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); }
        setStatus("Завершаем задачу...");
        
        state.tasks = state.tasks.filter(t => t.id !== id);
        renderTasks();

        request('completeTask', { id: id })
          .then(() => {
            loadData();
          })
          .catch(err => {
            showError("Ошибка закрытия задачи: " + err.message);
            loadData();
          });
      }

      function setupFormListeners() {
        const selectFilter = document.getElementById('taskWho');
        if(selectFilter) {
          selectFilter.addEventListener('change', (e) => {
            state.filters.todoWho = e.target.value;
            renderTasks();
          });
        }

        document.getElementById('taskForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const data = Object.fromEntries(fd.entries());
          
          if (tg && tg.HapticFeedback) { tg.HapticFeedback.impactOccurred('medium'); }
          setStatus("Добавляем новую задачу...");
          
          request('createTask', data)
            .then(() => {
              e.target.reset();
              initDefaults();
              document.getElementById('taskFormWrap').classList.remove('open');
              document.getElementById('toggleTaskFormBtn').textContent = '+ Новое дело';
              loadData();
            })
            .catch(err => showError(err));
        });

        document.getElementById('expenseForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const data = Object.fromEntries(fd.entries());
          data.kind = 'expense';
          
          if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); }
          setStatus("Записываем расход...");
          
          request('createTransaction', data)
            .then(() => {
              e.target.reset();
              initDefaults();
              switchView('todo');
              loadData();
            })
            .catch(err => showError(err));
        });

        document.getElementById('incomeForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const data = Object.fromEntries(fd.entries());
          data.kind = 'income';
          
          if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); }
          setStatus("Записываем доход...");
          
          request('createTransaction', data)
            .then(() => {
              e.target.reset();
              initDefaults();
              switchView('todo');
              loadData();
            })
            .catch(err => showError(err));
        });

        document.getElementById('savingForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const data = Object.fromEntries(fd.entries());
          data.kind = 'saving';
          data.category = 'Копилка';
          
          if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('success'); }
          setStatus("Откладываем деньги...");
          
          request('createTransaction', data)
            .then(() => {
              e.target.reset();
              initDefaults();
              switchView('todo');
              loadData();
            })
            .catch(err => showError(err));
        });
      }

      function request(name, data = {}) {
        const telegramInitData = window.Telegram?.WebApp?.initData || "";
        const url = `${APPS_SCRIPT_URL}?action=${name}`;
        return fetch(url, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-telegram-init-data': telegramInitData
          },
          body: JSON.stringify(data) 
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`Ошибка сервера: ${response.status}`);
            }
            return response.json();
          })
          .then((result) => {
            if (result.success === false || !result.data) {
              throw new Error(result.error || 'Не удалось выполнить запрос.');
            }
            return result.data;
          });
      }

      function setStatus(message) {
        const status = document.getElementById('status');
        status.classList.remove('error');
        status.textContent = message || '';
        if(message) status.classList.add('show');
        else status.classList.remove('show');
      }

      function showError(error) {
        const message = error && error.message ? error.message : String(error);
        const status = document.getElementById('status');
        status.classList.add('error');
        status.textContent = message;
        status.classList.add('show');
        if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred('error'); }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatMoney(num) {
        return Number(num).toLocaleString('ru-RU') + ' ₸';
      }

      function formatDateHuman(str) {
        if(!str) return '';
        const parts = str.split('-');
        if(parts.length !== 3) return str;
        return `${parts[2]}.${parts[1]}.${parts[0].substring(2)}`;
      }
    </script>
  </body>
</html>
